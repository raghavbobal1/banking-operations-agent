# AI must be enabled deliberately. Without credentials the deterministic demo remains usable.
app.ai.enabled=${AI_ENABLED:false}
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-disabled}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.options.max-tokens=600
spring.ai.retry.max-attempts=1
